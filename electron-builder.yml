appId: com.tableflow.pro
productName: TableFlow Pro
copyright: Copyright © 2024 TableFlow Pro

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*

extraResources:
  - from: electron/database
    to: database

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TableFlow Pro

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-thermal-printer/**
